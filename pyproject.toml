[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-shift"
version = "0.1.0"
description = "Research framework for investigating provenance and contextual role as mechanisms for covert persona drift in instruction-tuned language models."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ProvenanceShift Contributors"},
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
quantization = [
    "bitsandbytes>=0.40",
    "accelerate>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=tests/integration"
markers = [
    "integration: marks tests that require model downloads and/or GPU (deselect with '--ignore=tests/integration')",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.md"]
